<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutor Casa</title>
<meta name="theme-color" content="#2B2C2F">
<meta name="description" content="Le faccende di casa, una alla volta.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>

<script>
  try { var t = localStorage.getItem('tc-tema'); if (t === 'scuro' || t === 'chiaro') document.documentElement.dataset.tema = t; } catch (e) {}
</script>
<style>

/* ---------- Caratteri inclusi nell'app (funzionano senza connessione) ---------- */
@font-face { font-family: "Manrope"; src: url("fonts/manrope.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Space Grotesk"; src: url("fonts/space-grotesk.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }

/* ---------- Token del Design System Tutor Casa (D18) ---------- */
:root {
  color-scheme: dark;
  /* Base comune · tema scuro (principale) */
  --ground: #2B2C2F;
  --ground-ink: #ECEDEE;
  --ground-muted: #B4B9BE;
  --panel: #D3DBE2;
  --panel-hero: #E4EAEF;
  --panel-inset: #C7D0D8;
  --ink: #1B2228;
  --ink-muted: #4D5A65;
  --line: rgba(255,255,255,0.10);
  --tile-off: rgba(211,219,226,0.08);
  --tile-off-ink: #C3C9CF;
  --topic: #D4FF3A;
  --topic-ink: #12160A;
  --stato-ok: #34C77B;
  --stato-info: #4FA8E0;
  --stato-attenzione: #FACC15;
  --stato-da-fare: #F59E0B;
  --stato-allerta: #DC2626;
  --stato-ink: #1B2228;
  --stato-allerta-ink: #FFFFFF;
  --shadow-rilievo: 14px 14px 32px rgba(0,0,0,0.45), -8px -8px 22px rgba(255,255,255,0.06), inset 1px 1px 0 rgba(255,255,255,0.7);
  --shadow-scavato: inset 5px 5px 12px rgba(84,100,116,0.45), inset -5px -5px 12px rgba(255,255,255,0.75);
  --shadow-topic: 0 8px 18px -6px rgba(90,110,20,0.55);
  --bagliore-forza: 1;

  /* Tema di categoria · Lavatrice */
  --tema-1: #0F6A72;   /* lav-petrolio */
  --tema-2: #2FB6A3;   /* lav-acquamarina */
  --tema-3: #4FA8E0;   /* lav-azzurro */
  --tema-oblo: #16323B;
  --tema-icona: #7CC8D8;

  /* Tipografia, spazi, raggi */
  --font-sans: "Manrope", system-ui, sans-serif;
  --font-tecnico: "Space Grotesk", "Manrope", system-ui, sans-serif;
  --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px;
  --space-7: 28px; --space-8: 32px; --space-12: 48px;
  --radius-sm: 16px; --radius-md: 24px; --radius-lg: 26px; --radius-xl: 36px; --radius-pill: 999px;
  --margine: var(--space-12);
}
/* Tema chiaro: scelto a mano, oppure automatico se il tablet è in modalità chiara */
:root[data-tema="chiaro"] {
  color-scheme: light;
  --ground: #DDE3E8; --ground-ink: #1B2228; --ground-muted: #4D5A65;
  --panel: #F2F5F7; --panel-hero: #FFFFFF; --panel-inset: #E2E8ED;
  --line: rgba(27,34,40,0.12); --tile-off: rgba(27,34,40,0.05); --tile-off-ink: #4D5A65;
  --shadow-rilievo: 10px 10px 24px rgba(84,100,116,0.28), -8px -8px 20px rgba(255,255,255,0.9);
  --tema-icona: #0F6A72; --bagliore-forza: 0.55;
}
@media (prefers-color-scheme: light) {
  :root:not([data-tema="scuro"]) {
    color-scheme: light;
    --ground: #DDE3E8; --ground-ink: #1B2228; --ground-muted: #4D5A65;
    --panel: #F2F5F7; --panel-hero: #FFFFFF; --panel-inset: #E2E8ED;
    --line: rgba(27,34,40,0.12); --tile-off: rgba(27,34,40,0.05); --tile-off-ink: #4D5A65;
    --shadow-rilievo: 10px 10px 24px rgba(84,100,116,0.28), -8px -8px 20px rgba(255,255,255,0.9);
    --tema-icona: #0F6A72; --bagliore-forza: 0.55;
  }
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow-x: hidden; overflow-x: clip; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; min-height: 100%;
  background: var(--ground); color: var(--ground-ink);
  font-family: var(--font-sans); font-size: 17px; line-height: 24px; font-weight: 500;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
  transition: background-color 600ms ease;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--topic); outline-offset: 3px; }

/* ---------- Sfondo: bagliori del tema di categoria ---------- */
.sfondo { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.bagliore { position: absolute; border-radius: 50%; filter: blur(100px); transition: background-color 600ms ease, opacity 600ms ease; }
.bagliore.b1 { width: 70vmax; height: 70vmax; left: -22vmax; top: -18vmax; background: var(--tema-1); opacity: calc(0.6 * var(--bagliore-forza)); animation: deriva 18s ease-in-out infinite; }
.bagliore.b2 { width: 62vmax; height: 62vmax; right: -26vmax; top: 30vh; background: var(--tema-3); opacity: calc(0.38 * var(--bagliore-forza)); animation: deriva 22s ease-in-out infinite reverse; }
.bagliore.b3 { width: 52vmax; height: 52vmax; left: 15vw; bottom: -22vmax; background: var(--tema-2); opacity: calc(0.4 * var(--bagliore-forza)); animation: deriva 26s ease-in-out infinite; }
@keyframes deriva { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(30px, 24px); } }

/* ---------- Stili di testo ---------- */
.display { margin: 0; font-size: 44px; line-height: 48px; font-weight: 800; letter-spacing: -1px; }
.titolo-pannello { margin: 0; font-size: 40px; line-height: 40px; font-weight: 800; letter-spacing: -1px; }
.titolo-riquadro { margin: 0; font-size: 22px; line-height: 28px; font-weight: 800; }
.corpo-piccolo { font-size: 15px; line-height: 21px; }
.etichetta { margin: 0; font-family: var(--font-tecnico); font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; }

/* ---------- Superfici ---------- */
.pannello-hero { background: var(--panel-hero); color: var(--ink); box-shadow: var(--shadow-rilievo); border-radius: var(--radius-xl); padding: var(--space-8); }
.riquadro { background: var(--panel-inset); color: var(--ink); box-shadow: var(--shadow-scavato); border-radius: var(--radius-lg); padding: 22px var(--space-6); }

/* ---------- Pulsanti ---------- */
.pulsante-principale {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: 52px; padding: 14px 24px; border: 0; border-radius: var(--radius-sm);
  background: var(--topic); color: var(--topic-ink); box-shadow: var(--shadow-topic);
  font-size: 16px; font-weight: 800; cursor: pointer;
}
.pulsante-servizio {
  width: 60px; height: 60px; flex: none; border: 0; border-radius: 20px;
  background: var(--panel); color: var(--ink); box-shadow: var(--shadow-rilievo);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  text-decoration: none; transition: box-shadow 120ms ease;
}
.pulsante-servizio:active { box-shadow: var(--shadow-scavato); }

/* ---------- Segnalazioni (bollini) ---------- */
.bollino { display: inline-block; padding: 5px 12px; border-radius: var(--radius-pill); font-size: 13px; line-height: 16px; font-weight: 800; color: var(--stato-ink); white-space: nowrap; }
.bollino.ok { background: var(--stato-ok); }
.bollino.info { background: var(--stato-info); }
.bollino.attenzione { background: var(--stato-attenzione); }
.bollino.da-fare { background: var(--stato-da-fare); }
.bollino.allerta { background: var(--stato-allerta); color: var(--stato-allerta-ink); }
.segnalazione { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.segnalazione .frase { overflow-wrap: anywhere; font-size: 15px; line-height: 21px; font-weight: 600; color: var(--ink-muted); }

/* ---------- Manopola ---------- */
.manopola { width: 300px; height: 300px; flex: none; }
.manopola .tacca { stroke: #9AA7B2; stroke-width: 2; stroke-linecap: round; }
.manopola .quadrante { font-family: var(--font-tecnico); font-size: 16px; font-weight: 600; fill: var(--ink-muted); text-anchor: middle; dominant-baseline: central; }
.onda-1 { animation: onda 4s linear infinite; }
.onda-2 { animation: onda-inversa 6s linear infinite; }
@keyframes onda { from { transform: translateX(0); } to { transform: translateX(-60px); } }
@keyframes onda-inversa { from { transform: translateX(-60px); } to { transform: translateX(0); } }
.led { width: 10px; height: 10px; flex: none; border-radius: 50%; background: var(--topic); animation: respiro 2.4s ease-in-out infinite; }
@keyframes respiro { 0%, 100% { box-shadow: 0 0 0 4px rgba(27,34,40,0.12), 0 0 10px rgba(160,200,20,0.55); } 50% { box-shadow: 0 0 0 7px rgba(27,34,40,0.06), 0 0 18px rgba(160,200,20,0.8); } }


.riquadro { display: flex; flex-direction: column; justify-content: center; gap: var(--space-2); }
.riquadro .etichetta { color: var(--ink-muted); }
[hidden] { display: none !important; }

/* ---------- Schermo e transizioni ---------- */
.schermo { position: relative; z-index: 1; min-height: 100%; max-width: 1280px; margin: 0 auto; padding: 56px var(--margine) var(--space-12); }
.schermo.avanti { animation: da-destra 380ms cubic-bezier(.2,.7,.2,1) backwards; }
.schermo.indietro { animation: da-sinistra 380ms cubic-bezier(.2,.7,.2,1) backwards; }
.schermo.apertura { animation: entrata 420ms ease-out backwards; }
@keyframes da-destra { from { opacity: 0; transform: translateX(48px); } to { opacity: 1; transform: none; } }
@keyframes da-sinistra { from { opacity: 0; transform: translateX(-48px); } to { opacity: 1; transform: none; } }
@keyframes entrata { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
h1:focus { outline: none; }

/* ---------- Home (tavole D · Mix, decisioni M1) ---------- */
.schermo { display: flex; flex-direction: column; min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
.home {
  flex: 1; display: grid; gap: var(--space-7);
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "testata" "striscia" "protagonista" "info" "oggi" "faccende" "avviso";
  grid-template-rows: auto auto auto auto auto auto 1fr;
}
.colonna-sinistra, .colonna-destra { display: contents; }
.testata { grid-area: testata; display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); }
.testata .etichetta { color: var(--ground-muted); font-size: 15px; }
.testata-testi { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
/* Striscia dello stato dati (H5): sempre visibile, porta a Dati e impostazioni */
.striscia-dati { grid-area: striscia; margin-top: calc(-1 * var(--space-5)); display: flex; align-items: center; gap: var(--space-3); min-height: 48px; color: var(--ground-ink); text-decoration: none; font-size: 15px; line-height: 21px; font-weight: 700; }
.striscia-dati .testo { min-width: 0; overflow-wrap: anywhere; }
.striscia-dati .frase { color: var(--ground-muted); font-weight: 600; }
.striscia-dati svg { flex: none; stroke: var(--ground-muted); }
/* Pannello protagonista: la categoria in evidenza */
.protagonista { grid-area: protagonista; display: flex; align-items: center; gap: 36px; cursor: pointer; }
.protagonista-testi { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.protagonista-testi .etichetta { color: var(--ink-muted); font-size: 14px; display: flex; align-items: center; gap: 10px; }
.frase-hero { margin: 0; color: #3F4B55; line-height: 1.4; }
.azioni-hero { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: 6px; }
.azioni-hero a { text-decoration: none; }
.pulsante-secondario:disabled { background: transparent; box-shadow: none; border: 1.5px dashed rgba(27,34,40,0.32); color: var(--ink-muted); cursor: default; }
/* Info della categoria: due riquadri alla volta, si sfogliano */
.info { grid-area: info; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sfoglia { overflow: hidden; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
.binario { display: flex; gap: var(--space-5); transition: transform 380ms cubic-bezier(.2,.7,.2,1); }
.binario.trascina { transition: none; }
.pagina { flex: 0 0 100%; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-5); }
.pagina .riquadro { min-height: 120px; }
.pagina .intera { grid-column: 1 / -1; }
.riquadro.contatore { flex-direction: row; align-items: center; justify-content: flex-start; gap: var(--space-5); }
.contatore .testi { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.numero { font-family: var(--font-tecnico); font-size: 36px; line-height: 36px; font-weight: 700; }
.numero small { font-size: 18px; color: var(--ink-muted); }
.contatore .frase { font-size: 15px; color: var(--ink-muted); }
.pallini { display: flex; justify-content: center; }
.pallino { width: 40px; height: 40px; padding: 0; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; border-radius: var(--radius-pill); }
.pallino::before { content: ""; width: 8px; height: 8px; border-radius: 4px; background: var(--ground-muted); opacity: 0.55; transition: width 300ms ease, background-color 300ms ease, opacity 300ms ease; }
.pallino[aria-current="true"]::before { width: 22px; background: var(--topic); opacity: 1; }
/* Spazi riservati: visibili e spenti, come le tessere non pronte */
.spento { background: var(--tile-off); border: 1px solid var(--line); color: var(--tile-off-ink); box-shadow: none; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.spento .etichetta { color: var(--ground-muted); }
.spento .titolo-riquadro { color: var(--tile-off-ink); font-size: 19px; line-height: 25px; }
.frase-spenta { margin: 0; font-size: 15px; line-height: 21px; color: var(--ground-muted); }
.oggi { grid-area: oggi; min-height: 120px; padding: 22px var(--space-6); border-radius: var(--radius-md); display: flex; flex-direction: column; justify-content: center; gap: var(--space-2); }
/* Altre faccende */
.faccende { grid-area: faccende; display: flex; flex-direction: column; gap: 14px; }
.titolo-sezione { margin: 0; font-size: 20px; line-height: 26px; font-weight: 800; }
.tessere { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
.tessera {
  min-height: 124px; border-radius: var(--radius-md); border: 1px solid var(--line);
  background: var(--tile-off); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  padding: 18px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: var(--space-2);
  color: var(--tile-off-ink); text-decoration: none; font: inherit; text-align: left;
}
.tessera:disabled { cursor: not-allowed; }
.tessera.attiva { background: var(--panel); color: var(--ink); border-color: transparent; box-shadow: var(--shadow-rilievo); cursor: pointer; }
.tessera svg { flex: none; stroke: var(--tema-icona); }
.tessera.attiva svg { stroke: var(--ink); }
.tessera .testi { display: flex; flex-direction: column; gap: 4px; }
.tessera .nome { font-size: 17px; font-weight: 700; }
.tessera .etichetta { font-size: 12px; color: var(--ground-muted); }
/* Barra degli avvisi (H4) */
.barra-avviso { grid-area: avviso; align-self: end; display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: 18px 22px; border-radius: var(--radius-md); background: var(--panel); color: var(--ink); box-shadow: var(--shadow-rilievo); }
.barra-avviso .testi { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.barra-avviso strong { font-size: 16px; font-weight: 700; }
.barra-avviso span { font-size: 14px; line-height: 20px; color: var(--ink-muted); }
.barra-avviso.spento { background: var(--tile-off); color: var(--tile-off-ink); box-shadow: none; }
.barra-avviso.spento span { color: var(--ground-muted); }
.barra-avviso .pulsante-principale { flex: none; text-decoration: none; }
.solo-lettori { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.piede { color: var(--ground-muted); }

/* ---------- Schermate interne ---------- */
.interna { display: flex; flex-direction: column; gap: var(--space-7); }
.intestazione { display: flex; align-items: center; gap: var(--space-5); }
.intestazione-testi { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.intestazione .etichetta { color: var(--ground-muted); font-size: 14px; }
.vuota { display: flex; flex-direction: column; gap: var(--space-3); max-width: 720px; }
.vuota p { margin: 0; }
.voci { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-5); }
.voce {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  min-height: 96px; padding: 20px 22px; border-radius: var(--radius-md);
  background: var(--panel); color: var(--ink); box-shadow: var(--shadow-rilievo);
  text-decoration: none; transition: box-shadow 120ms ease, transform 120ms ease;
}
.voce:active { box-shadow: var(--shadow-scavato); transform: scale(0.99); }
.voce .testi { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.voce .codice { font-family: var(--font-tecnico); font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.4px; color: var(--ink-muted); }
.voce .nome { font-size: 20px; line-height: 26px; font-weight: 800; }
.voce .descrizione { font-size: 15px; line-height: 21px; color: var(--ink-muted); }
.voce svg { flex: none; stroke: var(--ink-muted); }
.riquadri { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--space-5); }
.riquadro .pulsante-principale { align-self: flex-start; margin-top: var(--space-2); }


/* ---------- Componenti (M0 passo 4) ---------- */
.pannello { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-rilievo); border-radius: var(--radius-md); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.pannello > h2 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 800; }
.spiega { margin: 0; font-size: 15px; line-height: 21px; color: var(--ink-muted); }
.vetrina { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: var(--space-6); align-items: start; }
.fila { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
.gruppo { display: flex; flex-direction: column; gap: var(--space-2); }
.gruppo-titolo { font-size: 16px; font-weight: 700; }
.pulsante-secondario {
  display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 14px 24px;
  border: 0; border-radius: var(--radius-sm); background: var(--panel-hero); color: var(--ink);
  box-shadow: 4px 4px 10px rgba(84,100,116,0.35), -4px -4px 10px rgba(255,255,255,0.8);
  font-size: 16px; font-weight: 800; cursor: pointer; transition: box-shadow 120ms ease;
}
.pulsante-secondario { position: relative; }
label.pulsante-secondario:focus-within { outline: 3px solid var(--topic); outline-offset: 3px; }
.pulsante-secondario:active, .pulsante-principale:active { box-shadow: var(--shadow-scavato); }
/* Chip: una sola scelta */
.chip {
  min-height: 48px; padding: 0 18px; border: 0; border-radius: var(--radius-pill);
  background: var(--panel-inset); color: var(--ink); font-size: 16px; font-weight: 700; cursor: pointer;
  box-shadow: inset 3px 3px 6px rgba(84,100,116,0.40), inset -3px -3px 6px rgba(255,255,255,0.70);
}
.chip[aria-checked="true"] { background: var(--topic); color: var(--topic-ink); font-weight: 800; box-shadow: var(--shadow-topic); }
/* Tag: più scelte insieme */
.tag {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px 0 12px;
  border: 1.5px solid rgba(27,34,40,0.28); border-radius: var(--radius-pill); background: transparent;
  color: var(--ink); font-size: 15px; font-weight: 700; cursor: pointer;
}
.tag svg { stroke: currentColor; flex: none; }
.tag[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel-hero); }
/* Voti 1–5 */
.voto-testa { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
.voto-parola { font-family: var(--font-tecnico); font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: var(--ink-muted); }
.voti { display: flex; gap: var(--space-3); }
.voto {
  width: 56px; height: 56px; flex: none; border: 0; border-radius: 50%; cursor: pointer;
  background: var(--panel-inset); color: var(--ink); font-family: var(--font-tecnico); font-size: 20px; font-weight: 700;
  box-shadow: inset 3px 3px 6px rgba(84,100,116,0.40), inset -3px -3px 6px rgba(255,255,255,0.70);
}
.voto[aria-checked="true"] { background: var(--topic); color: var(--topic-ink); box-shadow: var(--shadow-topic); }
/* Allerta del carico */
.allerta-blocco { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 18px; background: var(--panel-inset); }
.allerta-blocco .riga { display: flex; align-items: center; gap: 10px; }

.allerta-blocco .nota { color: var(--ink-muted); font-weight: 600; }
.elenco { display: flex; flex-direction: column; gap: var(--space-3); }
@media (max-width: 640px) { .voti { gap: var(--space-2); } .voto { width: auto; height: auto; flex: 1 1 0; max-width: 52px; aspect-ratio: 1; } }

/* ---------- Layout: orizzontale (tablet ruotato) ---------- */
@media (orientation: landscape) and (min-width: 900px) {
  :root { --margine: 44px; }
  .schermo { padding-top: 40px; padding-bottom: 40px; }
  .home {
    grid-template-columns: minmax(0, 0.82fr) minmax(0, 1fr);
    grid-template-areas: "sinistra destra" "faccende faccende" "avviso avviso";
    grid-template-rows: auto auto auto;
    align-content: space-between; column-gap: 40px; row-gap: 28px;
  }
  .colonna-sinistra { grid-area: sinistra; display: flex; flex-direction: column; gap: var(--space-6); min-width: 0; }
  .colonna-destra { grid-area: destra; display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }
  .striscia-dati { margin-top: calc(-1 * var(--space-4)); }
  .pagina { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .pagina .riquadro { min-height: 112px; }
  .oggi { min-height: 96px; }
  .protagonista { flex: 1; justify-content: center; gap: var(--space-7); padding: var(--space-6) var(--space-8); }
  .protagonista .manopola { width: 240px; height: 240px; }
  .faccende .titolo-sezione { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .tessere { gap: var(--space-5); }
  .tessera { min-height: 92px; flex-direction: row; align-items: center; justify-content: flex-start; gap: var(--space-4); }
  .barra-avviso { align-self: auto; }
}

/* ---------- Schermi stretti (smartphone, di supporto) ---------- */
@media (max-width: 640px) {
  :root { --margine: 20px; }
  .schermo { padding-top: 32px; }
  .home, .interna { gap: var(--space-6); }
  .display { font-size: 36px; line-height: 40px; }
  .protagonista { flex-direction: column; align-items: stretch; gap: var(--space-5); padding: var(--space-6); }
  .azioni-hero > * { flex: 1 1 auto; }
  .manopola { width: 220px; height: 220px; align-self: center; }
  .titolo-pannello { font-size: 32px; line-height: 34px; }
  .pagina, .tessere { grid-template-columns: 1fr; }
  .pagina { gap: var(--space-4); }
  .striscia-dati { margin-top: calc(-1 * var(--space-4)); }
  .tessera { min-height: 0; flex-direction: row; align-items: center; justify-content: flex-start; gap: var(--space-4); }
  .barra-avviso { flex-direction: column; align-items: stretch; }
  .voci, .riquadri { grid-template-columns: 1fr; }
}
@media (min-width: 641px) and (max-width: 760px) and (orientation: portrait) {
  .manopola { width: 240px; height: 240px; }
}

/* ---------- Riduci movimento ---------- */
@media (prefers-reduced-motion: reduce) {

}

  var tocco = null, bloccaClick = false;

      if (Math.abs(dx) < 10) return;

    tocco.s.querySelector('.binario').style.transform = spostamento(i, dx);

  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', aggiornaColoreBarra);

  /* ================= Connessione e funzionamento offline ================= */
  function seDati() { if (attuale === 'dati') ridisegna(); }
  window.addEventListener('online', seDati);
  window.addEventListener('offline', seDati);
  var NON_ATTIVO = { titolo: 'Non attivo', bollino: 'Da fare', classe: 'da-fare', frase: 'Apri l’app dal suo sito con la connessione' };
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(function () { stato.offline = NON_ATTIVO; seDati(); });
    navigator.serviceWorker.ready.then(function () {
      stato.offline = { titolo: 'Pronta', bollino: 'Fatto', classe: 'ok', frase: 'Puoi usarla anche in modalità aereo' };
      seDati();
    });
  } else {
    stato.offline = NON_ATTIVO;
  }

  /* ================= Installazione (Chrome per Android) ================= */
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); stato.richiestaInstallazione = e;
    if (attuale === 'home') ridisegna();
  });
  function installa() {
    var r = stato.richiestaInstallazione; if (!r) return;
    r.prompt();
    r.userChoice.finally(function () { stato.richiestaInstallazione = null; if (attuale === 'home') ridisegna(); });
  }
  window.addEventListener('appinstalled', function () { stato.installata = true; if (attuale === 'home') ridisegna(); });
})();
</script>
</body>
</html>
